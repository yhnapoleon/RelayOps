name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[agent,dev]"
      - run: python -m pytest tests -q --disable-warnings
      - run: python -m pytest mock_services/test_cml_platform.py -q --disable-warnings
      - run: python scripts/check_public_tree.py
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: python scripts/smoke_demo.py
      - if: failure()
        run: docker compose logs --no-color --tail=120
      - if: always()
        run: docker compose down --volumes
